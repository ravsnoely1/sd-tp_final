resolver 127.0.0.11 valid=5s ipv6=off;
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
upstream auth_nodes {
    zone auth_nodes 64k;
    server auth:8001 resolve max_fails=1 fail_timeout=5s;
}
upstream chat_nodes {
    zone chat_nodes 64k;
    server chat:8002 resolve max_fails=1 fail_timeout=5s;
}
server {
    listen 80;
    server_tokens off;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    location /api/auth/ {
        proxy_pass http://auth_nodes;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
    location / {
        proxy_pass http://chat_nodes;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 2s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
